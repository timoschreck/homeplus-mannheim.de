name: Cache-bust security hardening

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add security script version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = '20260602-formbackend'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('src="./security-hardening.js"', f'src="./security-hardening.js?v={version}"')
              text = text.replace('src="./security-hardening.js?v=20260602-formbackend"', f'src="./security-hardening.js?v={version}"')
              path.write_text(text, encoding='utf-8')

          config = Path('configuration.js')
          if config.exists():
              text = config.read_text(encoding='utf-8')
              text = text.replace("script.src = siteBase + 'security-hardening.js';", f"script.src = siteBase + 'security-hardening.js?v={version}';")
              config.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/cache-bust-security-hardening.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          grep -q 'security-hardening.js?v=20260602-formbackend' kontakt.html
          grep -q "security-hardening.js?v=20260602-formbackend" configuration.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Cache-bust security hardening script"
            git push
          fi
