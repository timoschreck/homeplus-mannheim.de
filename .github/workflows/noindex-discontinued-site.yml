name: Noindex discontinued site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add noindex to HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          robots_meta = '<meta name="robots" content="noindex, nofollow">'
          google_meta = '<meta name="googlebot" content="noindex, nofollow">'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              changed = False
              if 'name="robots" content="noindex' not in text:
                  if '<meta charset="UTF-8">' in text:
                      text = text.replace('<meta charset="UTF-8">', '<meta charset="UTF-8">\n    ' + robots_meta, 1)
                  elif '<head>' in text:
                      text = text.replace('<head>', '<head>\n    ' + robots_meta, 1)
                  else:
                      continue
                  changed = True
              if 'name="googlebot" content="noindex' not in text:
                  if robots_meta in text:
                      text = text.replace(robots_meta, robots_meta + '\n    ' + google_meta, 1)
                  elif '<head>' in text:
                      text = text.replace('<head>', '<head>\n    ' + google_meta, 1)
                  changed = True
              if changed:
                  path.write_text(text, encoding='utf-8')

          Path('robots.txt').write_text('User-agent: *\nAllow: /\n', encoding='utf-8')

          wf = Path('.github/workflows/noindex-discontinued-site.yml')
          if wf.exists():
              wf.unlink()
          PY

          grep -R "name=\"robots\" content=\"noindex, nofollow\"" -- *.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html robots.txt .github/workflows/noindex-discontinued-site.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Noindex discontinued business site"
            git push
          fi
